# Gitleaks Configuration
# https://github.com/gitleaks/gitleaks

title = "Synapse Gitleaks Configuration"

# Allowlist for known false positives
[allowlist]
  description = "Allowlisted files and patterns"
  
  # Paths to ignore completely
  paths = [
    '''\.gitleaks\.toml$''',
  ]

  # Regex patterns to ignore (example tokens in documentation/schemas)
  regexes = [
    '''YOUR_JWT_TOKEN''',
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.''',
  ]

# File-specific allowlists
[[rules]]
  id = "example-jwt-tokens"
  description = "Example JWT tokens in OpenAPI specs and schemas"
  path = '''(openapi\.json|auth\.py|implementation_guide\.md)$'''
  allowlist = { regexes = ['''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9'''] }

[[rules]]
  id = "curl-examples"
  description = "Curl examples with placeholder tokens"
  path = '''implementation_guide\.md$'''
  allowlist = { regexes = ['''Authorization: Bearer YOUR_JWT_TOKEN'''] }
