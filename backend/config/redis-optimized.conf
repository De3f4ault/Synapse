# ==================================================================
# Redis Configuration for Celery - Optimized for Production
# ==================================================================
#
# This configuration optimizes Redis for use as a Celery message broker
# and result backend, with focus on:
# - Message durability (AOF persistence)
# - Memory management
# - Connection limits
# - Performance tuning
#
# Usage:
#   redis-server /path/to/this/file
#
# Note: For local development, you can use default Redis
# For production, use this configuration with proper monitoring
# ==================================================================

# Network Configuration
bind 127.0.0.1
port 6379
tcp-backlog 511

# Connection limits
maxclients 10000
timeout 0

# ==================================================================
# PERSISTENCE - Critical for message durability
# ==================================================================

# AOF (Append Only File) - Provides better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec  # Write to disk every second (balanced performance/durability)

# RDB Snapshots (backup mechanism)
save 900 1      # After 900 sec (15 min) if at least 1 key changed
save 300 10     # After 300 sec (5 min) if at least 10 keys changed
save 60 10000   # After 60 sec if at least 10000 keys changed

dbfilename dump.rdb
dir ./data

# ==================================================================
# MEMORY MANAGEMENT
# ==================================================================

# Set maximum memory (adjust based on your system)
# For development: 256MB is reasonable
# For production with heavy load: 2GB-8GB
maxmemory 2gb

# Eviction policy: Don't evict anything (Celery needs guaranteed delivery)
# If Redis runs out of memory, it will return errors instead of evicting keys
maxmemory-policy noeviction

# ==================================================================
# PERFORMANCE TUNING
# ==================================================================

# Disable expensive operations that Celery doesn't need
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del yes

# Increase hash-max size for better performance with large task payloads
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# ==================================================================
# LOGGING
# ==================================================================

loglevel notice
logfile "redis.log"

# ==================================================================
# SECURITY (Basic)
# ==================================================================

# Uncomment and change for production
# requirepass your_strong_password_here

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""

# ==================================================================
# CELERY-SPECIFIC OPTIMIZATIONS
# ==================================================================

# List operations timeout (Celery uses BLPOP for task queuing)
# Default is fine, but can be tuned
list-max-ziplist-size -2
list-compress-depth 0

# ==================================================================
# MONITORING
# ==================================================================

# Enable slowlog for debugging
slowlog-log-slower-than 10000  # microseconds (10ms)
slowlog-max-len 128
