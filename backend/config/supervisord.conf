;; ============================================================================
;; SYNAPSE - Supervisor Configuration
;; ============================================================================
;; Process manager for production deployment
;; 
;; Usage:
;;   supervisord -c config/supervisord.conf           # Start daemon
;;   supervisorctl -c config/supervisord.conf status  # Check status
;;   supervisorctl -c config/supervisord.conf stop all  # Stop all
;; ============================================================================

[supervisord]
logfile=%(here)s/../logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=%(here)s/../logs
nodaemon=false
directory=%(here)s/..

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

;; ============================================================================
;; SYNAPSE API - FastAPI with Gunicorn
;; ============================================================================
[program:synapse-api]
command=%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin/gunicorn app.main:app -c config/gunicorn.conf.py
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stderr_logfile=%(here)s/../logs/synapse-api.err.log
stdout_logfile=%(here)s/../logs/synapse-api.out.log
environment=PATH="%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin:%(ENV_PATH)s"

;; ============================================================================
;; CELERY WORKER - Background Task Processing
;; ============================================================================
[program:celery-worker]
command=%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin/celery -A app.services.background.celery_app worker --pool=prefork --queues=webhook,rag,documents,default --loglevel=info --concurrency=4 --max-tasks-per-child=50 --max-memory-per-child=500000
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
killasgroup=true
stderr_logfile=%(here)s/../logs/celery-worker.err.log
stdout_logfile=%(here)s/../logs/celery-worker.out.log
environment=PATH="%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin:%(ENV_PATH)s"

;; ============================================================================
;; CELERY BEAT - Periodic Task Scheduler
;; ============================================================================
[program:celery-beat]
command=%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin/celery -A app.services.background.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stderr_logfile=%(here)s/../logs/celery-beat.err.log
stdout_logfile=%(here)s/../logs/celery-beat.out.log
environment=PATH="%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin:%(ENV_PATH)s"

;; ============================================================================
;; QDRANT - Vector Database
;; ============================================================================
[program:qdrant]
command=/usr/local/bin/qdrant
directory=%(here)s/../data/qdrant
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stderr_logfile=%(here)s/../logs/qdrant.err.log
stdout_logfile=%(here)s/../logs/qdrant.out.log

;; ============================================================================
;; PROCESS GROUP - All Synapse Services
;; ============================================================================
[group:synapse]
programs=synapse-api,celery-worker,celery-beat,qdrant
priority=999
