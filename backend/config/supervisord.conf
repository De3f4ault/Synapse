;; ============================================================================
;; SYNAPSE - Supervisor Configuration (OPTIMIZED for 4-core CPU, 16GB RAM)
;; ============================================================================
;; Process manager for production deployment
;;
;; Resource Optimization:
;; - Gunicorn: 3 workers (reduced from cpu*2+1)
;; - Celery IO: 2 concurrency for emails, webhooks (fast IO-bound tasks)
;; - Celery CPU: 1 concurrency for RAG, embeddings, OCR (CPU-intensive)
;;
;; Usage:
;;   supervisord -c config/supervisord.conf           # Start daemon
;;   supervisorctl -c config/supervisord.conf status  # Check status
;;   supervisorctl -c config/supervisord.conf stop all  # Stop all
;; ============================================================================

[supervisord]
logfile=%(here)s/../logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=%(here)s/../logs
nodaemon=false
directory=%(here)s/..

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

;; ============================================================================
;; SYNAPSE API - FastAPI with Gunicorn (OPTIMIZED: 3 workers)
;; ============================================================================
[program:synapse-api]
command=%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin/gunicorn app.main:app -c config/gunicorn.conf.py
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stderr_logfile=%(here)s/../logs/synapse-api.err.log
stdout_logfile=%(here)s/../logs/synapse-api.out.log
environment=PATH="%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin:%(ENV_PATH)s",GUNICORN_WORKERS="3"

;; ============================================================================
;; CELERY WORKER (IO-BOUND) - Emails, Webhooks, Default Tasks
;; ============================================================================
;; Fast, lightweight tasks that mostly wait on network/IO
;; Concurrency: 2 (can handle more concurrent tasks since they're IO-bound)
;; Memory: 300MB limit (these tasks use less memory)
[program:celery-io-worker]
command=%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin/celery -A app.services.background.celery_app worker --pool=prefork --queues=emails,default,webhook --loglevel=info --concurrency=2 --max-tasks-per-child=100 --max-memory-per-child=300000 -n io_worker@%%h
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
killasgroup=true
stderr_logfile=%(here)s/../logs/celery-io-worker.err.log
stdout_logfile=%(here)s/../logs/celery-io-worker.out.log
environment=PATH="%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin:%(ENV_PATH)s"

;; ============================================================================
;; CELERY WORKER (CPU-BOUND) - RAG, Embeddings, Documents, OCR
;; ============================================================================
;; Heavy CPU tasks: embedding generation, document processing, OCR
;; Concurrency: 1 (prevents CPU thrashing for intensive tasks)
;; Memory: 500MB limit (sentence-transformers + document processing)
;; Recycle after 25 tasks to prevent memory buildup
[program:celery-cpu-worker]
command=%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin/celery -A app.services.background.celery_app worker --pool=prefork --queues=rag,embeddings,documents,ocr --loglevel=info --concurrency=1 --max-tasks-per-child=25 --max-memory-per-child=500000 -n cpu_worker@%%h
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
killasgroup=true
stderr_logfile=%(here)s/../logs/celery-cpu-worker.err.log
stdout_logfile=%(here)s/../logs/celery-cpu-worker.out.log
environment=PATH="%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin:%(ENV_PATH)s"

;; ============================================================================
;; CELERY BEAT - Periodic Task Scheduler
;; ============================================================================
[program:celery-beat]
command=%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin/celery -A app.services.background.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stderr_logfile=%(here)s/../logs/celery-beat.err.log
stdout_logfile=%(here)s/../logs/celery-beat.out.log
environment=PATH="%(ENV_HOME)s/Desktop/Projects/synapse/.venv/bin:%(ENV_PATH)s"

;; ============================================================================
;; INFRASTRUCTURE DEPENDENCIES (NOT managed by Supervisor)
;; ============================================================================
;; The following services are managed by systemd and should be running:
;;   - PostgreSQL: systemctl status postgresql
;;   - Redis/Valkey: systemctl status redis (or valkey)
;;   - Qdrant: systemctl status qdrant
;;
;; These are treated as infrastructure, same as a database connection.
;; Supervisor only manages application-level services.
;; ============================================================================

;; ============================================================================
;; PROCESS GROUP - All Synapse Application Services
;; ============================================================================
[group:synapse]
programs=synapse-api,celery-io-worker,celery-cpu-worker,celery-beat
priority=999

