# ============================================================================
# SYNAPSE - Nginx Reverse Proxy Configuration
# ============================================================================
# This configuration provides:
# - HTTPS with SSL/TLS termination (self-signed certs for local dev)
# - Load balancing across multiple Gunicorn workers
# - Static file serving for React frontend
# - WebSocket support for real-time features
# - Security headers and rate limiting
# - Gzip compression
# ============================================================================

# Upstream backend servers (Gunicorn workers)
# For local development, we run multiple workers on localhost
upstream synapse_backend {
    # Least connections load balancing strategy
    least_conn;
    
    # Backend server(s) - add more for horizontal scaling
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;  # Uncomment for additional workers
    
    # Keep-alive connections for better performance
    keepalive 32;
}

# Rate limiting zone
# Limits: 10 requests per second per IP, with burst of 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# ============================================================================
# HTTP Server - Redirect to HTTPS
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost synapse.local;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# ============================================================================
# HTTPS Server - Main Application
# ============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost synapse.local;
    
    # ========================================================================
    # SSL/TLS Configuration
    # ========================================================================
    # Self-signed certificates (for local dev/testing)
    # Generate with: ./scripts/ssl-setup.sh
    ssl_certificate /etc/nginx/ssl/synapse.crt;
    ssl_certificate_key /etc/nginx/ssl/synapse.key;
    
    # SSL Session Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # HSTS (HTTP Strict Transport Security)
    # Comment out for local dev if you don't want strict HTTPS enforcement
    # add_header Strict-Transport-Security "max-age=63072000" always;
    
    # ========================================================================
    # Security Headers
    # ========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (adjust for your needs)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
    
    # ========================================================================
    # Logging
    # ========================================================================
    access_log /var/log/nginx/synapse_access.log;
    error_log /var/log/nginx/synapse_error.log warn;
    
    # ========================================================================
    # Gzip Compression
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    
    # ========================================================================
    # Root and Index
    # ========================================================================
    root /home/de3f4ault/Desktop/Projects/synapse/frontend/dist;
    index index.html;
    
    # ========================================================================
    # API Routes - Reverse Proxy to Backend
    # ========================================================================
    location /api/ {
        # Rate limiting for API endpoints
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        
        # Proxy settings
        proxy_pass http://synapse_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Keep-alive
        proxy_set_header Connection "";
    }
    
    # ========================================================================
    # WebSocket Routes - Upgrade Connection
    # ========================================================================
    location /ws/ {
        # Rate limiting for WebSocket connections
        limit_req zone=general_limit burst=10 nodelay;
        
        # Proxy settings
        proxy_pass http://synapse_backend;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific timeouts (longer for persistent connections)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }
    
    # ========================================================================
    # API Documentation (if not in production)
    # ========================================================================
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://synapse_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ========================================================================
    # Static Files - Serve Directly with Nginx
    # ========================================================================
    location /assets/ {
        # Frontend build assets
        alias /home/de3f4ault/Desktop/Projects/synapse/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Uploaded files
    location /uploads/ {
        alias /home/de3f4ault/Desktop/Projects/synapse/backend/data/uploads/;
        expires 1h;
        add_header Cache-Control "public";
    }
    
    # ========================================================================
    # React SPA - All Other Routes
    # ========================================================================
    location / {
        # Rate limiting for general traffic
        limit_req zone=general_limit burst=50 nodelay;
        
        # Try to serve file directly, fallback to index.html for SPA routing
        try_files $uri $uri/ /index.html;
        
        # Cache static HTML
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    
    # ========================================================================
    # Error Pages
    # ========================================================================
    error_page 404 /index.html;
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # ========================================================================
    # Security - Deny Access to Hidden Files
    # ========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
