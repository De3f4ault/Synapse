# Alembic configuration file for SYNAPSE

[alembic]
# Path to migration scripts
script_location = alembic

# Template for generating migration file names
# Example: 001_initial_schema_20231122_1234.py
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps (use UTC)
timezone = UTC

# Set to 'true' to run truncate_slug_length filter
truncate_slug_length = 40

# ============================================================================
# Logging Configuration
# ============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# ============================================================================
# Database URL
# ============================================================================
# NOTE: This is overridden by env.py which reads from settings.DATABASE_URL
# Keep this as placeholder only
sqlalchemy.url = driver://user:pass@localhost/dbname

# ============================================================================
# Post-Write Hooks
# ============================================================================
# Run black formatter on generated migration files
[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = --line-length=100
