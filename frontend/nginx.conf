server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Upload size — DMS accepts large documents (PDFs, archives, images).
    # Default Nginx limit is 1MB which silently breaks all uploads over 1MB
    # with a 413 that presents to the user as a network error.
    # FastAPI enforces its own MAX_UPLOAD_SIZE limit above this.
    # -------------------------------------------------------------------------
    client_max_body_size 500m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://synapse-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large file uploads and long-running AI operations
        proxy_read_timeout    300s;
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;
    }

    # Proxy WebSocket connections
    location /ws {
        proxy_pass http://synapse-api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

