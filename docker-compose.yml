name: synapse

services:
  # =========================================================
  # Databases & Infrastructure
  # =========================================================
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: synapse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse_user
      POSTGRES_PASSWORD: synapse_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse_user -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: synapse-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # =========================================================
  # Backend Services
  # =========================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapse-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://synapse_user:synapse_pass@postgres:5432/synapse
      - PG_LISTEN_DSN=postgresql://synapse_user:synapse_pass@postgres:5432/synapse
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker-io:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapse-worker-io
    restart: unless-stopped
    command: ["celery", "-A", "app.services.background.celery_app", "worker", "--queues=emails,default,webhook", "--loglevel=info", "--concurrency=2"]
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://synapse_user:synapse_pass@postgres:5432/synapse
      - PG_LISTEN_DSN=postgresql://synapse_user:synapse_pass@postgres:5432/synapse
    depends_on:
      - api
      - redis

  worker-cpu:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapse-worker-cpu
    restart: unless-stopped
    command: ["celery", "-A", "app.services.background.celery_app", "worker", "--queues=rag,embeddings,documents,ocr,ingestion", "--loglevel=info", "--concurrency=1"]
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://synapse_user:synapse_pass@postgres:5432/synapse
      - PG_LISTEN_DSN=postgresql://synapse_user:synapse_pass@postgres:5432/synapse
    depends_on:
      - api
      - redis

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapse-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.services.background.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://synapse_user:synapse_pass@postgres:5432/synapse
      - PG_LISTEN_DSN=postgresql://synapse_user:synapse_pass@postgres:5432/synapse
    depends_on:
      - api
      - redis

  # =========================================================
  # Frontend Service
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synapse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
